apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # zero downtime
  template:
    metadata:
      labels: { app: api }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: api
          image: "{{ .Values.registry }}/go-nats/api:{{ .Values.imageTag }}"
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: NATS_URL, value: {{ .Values.natsUrl | quote }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres, key: database-url } }
          livenessProbe: # process alive? (no dependency checks)
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe: # NATS + DB reachable? only then send traffic
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: { app: api, metrics: "true" }
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz # ALB health check for this target group
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: http }
